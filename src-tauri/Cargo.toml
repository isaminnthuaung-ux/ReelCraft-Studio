[package]
name = "long-to-shot-studio"
version = "1.0.1"
description = "A local Windows video splitter with Unicode text overlays"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"] }
cosmic-text = "0.14"

[dev-dependencies]
tempfile = "3"
