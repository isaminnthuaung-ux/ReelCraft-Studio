name: Windows ready-to-use ZIP

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-portable-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-portable-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows release
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Package app, FFmpeg, and notices
        shell: pwsh
        run: ./scripts/package-public.ps1
      - name: Test extracted download
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ReelCraftStudio-Windows-x64
          path: |
            FinalBuild/Downloads/*.zip
            FinalBuild/Downloads/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Download instructions
        shell: pwsh
        run: |
          @'
          ## Windows download
          Download **ReelCraftStudio-Windows-x64** from this run's Artifacts.
          Extract the artifact, then extract the included Windows-x64 ZIP.
          Open ReelCraftStudio.exe. FFmpeg and ffprobe are included.
          If WebView2 is missing, run prerequisites/Install-WebView2.exe (internet required).
          Tag builds also publish the ZIP as a public GitHub Release download.
          '@ >> $env:GITHUB_STEP_SUMMARY

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ReelCraftStudio-Windows-x64
          path: downloads
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "ReelCraft Studio $RELEASE_TAG" --notes "Windows x64: download the Windows-x64 ZIP, extract all files, and open ReelCraftStudio.exe. FFmpeg and ffprobe are included. If needed, prerequisites/Install-WebView2.exe installs Microsoft's WebView2 Runtime using an internet connection. Source archive and SHA-256 checksums are included."
          fi
          gh release upload "$RELEASE_TAG" downloads/*.zip downloads/SHA256SUMS.txt --clobber
