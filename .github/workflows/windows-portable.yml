name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-tag:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Create version tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_SHA: ${{ github.sha }}
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          build=$(node -p "require('./package.json').buildNumber")
          config_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [[ "$version" != "$config_version" || ! "$build" =~ ^[0-9]+$ ]]; then
            echo "package.json and tauri.conf.json versions/build number do not agree." >&2
            exit 1
          fi
          tag="v${version}-build.${build}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/$tag:refs/tags/$tag"
            existing=$(git rev-list -n 1 "$tag")
            if [[ "$existing" != "$GH_SHA" ]]; then
              echo "Tag $tag already points to $existing. Bump package.json buildNumber or version before pushing another release." >&2
              exit 1
            fi
            echo "Tag $tag already points to this commit; continuing its build."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" "$GH_SHA" -m "ReelCraft Studio $tag"
            git push origin "refs/tags/$tag"
          fi
          echo "release_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Created or verified release tag **$tag**. Windows build will run from this tag." >> "$GITHUB_STEP_SUMMARY"

  windows:
    needs: [create-tag]
    if: >-
      !cancelled() && (
      needs.create-tag.outputs.release_tag != '' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'pull_request')
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.create-tag.outputs.release_tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Prepare Rust
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-portable-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-portable-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
      - name: Install frontend dependencies
        run: npm ci
      - name: Build Windows release
        run: npm run tauri -- build --no-bundle -- --locked
      - name: Package app, FFmpeg, and notices
        shell: pwsh
        run: ./scripts/package-public.ps1
      - name: Test extracted download
        shell: pwsh
        run: ./scripts/test-windows-package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: ReelCraftStudio-Windows-x64
          path: |
            FinalBuild/Downloads/*.zip
            FinalBuild/Downloads/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Download instructions
        shell: pwsh
        run: |
          @'
          ## Windows download
          Download **ReelCraftStudio-Windows-x64** from this run's Artifacts.
          Extract the artifact, then extract the included Windows-x64 ZIP.
          Open ReelCraftStudio.exe. FFmpeg and ffprobe are included.
          If WebView2 is missing, run prerequisites/Install-WebView2.exe (internet required).
          Version tags also publish the ZIP as a public GitHub Release download.
          '@ >> $env:GITHUB_STEP_SUMMARY

  release:
    if: >-
      !cancelled() && needs.windows.result == 'success' &&
      (needs.create-tag.outputs.release_tag != '' || startsWith(github.ref, 'refs/tags/v'))
    needs: [create-tag, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ReelCraftStudio-Windows-x64
          path: downloads
      - name: Publish release downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.create-tag.outputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "ReelCraft Studio $RELEASE_TAG" --notes "Windows x64 portable download with FFmpeg and ffprobe included. SHA-256 checksums are included."
          fi
          gh release upload "$RELEASE_TAG" downloads/*.zip downloads/*SHA256SUMS.txt --clobber
